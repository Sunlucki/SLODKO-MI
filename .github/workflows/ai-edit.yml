# Edit the site content with an LLM from the browser or phone:
# Actions → "AI edit" → Run workflow → type the instruction → a pull request with the change opens.
# Review the diff (and the preview below it), merge → deploy.yml publishes the site.
# Translations work the same way ("przetłumacz nowe FAQ na angielski", "переведи сайт на украинский"): they land in
# src/data/i18n/<locale>/; the run summary shows how complete every language is.
#
# Setup (Settings → Secrets and variables → Actions):
#   secret    LLM_API_KEY   — Anthropic key (default provider) or the key of an OpenAI-compatible API
#   variables LLM_PROVIDER  — anthropic (default) | openai
#             LLM_MODEL     — optional for anthropic (default claude-opus-5-5), required for openai
#             LLM_BASE_URL  — for openai-compatible APIs, e.g. https://openrouter.ai/api/v1
# Settings → Actions → General → Workflow permissions: enable "Allow GitHub Actions to create and approve pull requests".
name: AI edit

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: Co zmienić na stronie? (po polsku lub po rosyjsku; także „przetłumacz … na angielski”)
        required: true
        type: string
      provider:
        description: anthropic | openai (puste = zmienna LLM_PROVIDER)
        required: false
        type: string
      model:
        description: Model (puste = zmienna LLM_MODEL / domyślny)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# No shared concurrency group: GitHub keeps only one pending run per group, so a third quick edit would cancel
# the queued second one. Each run works on its own checkout and branch (ai-edit/<run id>) → its own pull request.

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The instruction goes through env, never straight into the shell script (no injection)
      - name: Edit content with the LLM
        id: ai
        run: npm run ai -- "$INSTRUCTION" --yes
        env:
          INSTRUCTION: ${{ inputs.instruction }}
          LLM_PROVIDER: ${{ inputs.provider || vars.LLM_PROVIDER || 'anthropic' }}
          LLM_MODEL: ${{ inputs.model || vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      # Same build as production: content check, pre-render, SEO checks
      - name: Build
        run: npm run build

      # Informational: how many texts each language still shows in Polish (never fails the run)
      - name: Translation status
        id: i18n
        continue-on-error: true
        run: |
          npm run --silent i18n:status > "$RUNNER_TEMP/i18n.md"
          { echo '### Translations'; echo; cat "$RUNNER_TEMP/i18n.md"; } >> "$GITHUB_STEP_SUMMARY"
          { echo 'table<<EOF_I18N'; cat "$RUNNER_TEMP/i18n.md"; echo 'EOF_I18N'; } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: src/data
          branch: ai-edit/${{ github.run_id }}
          delete-branch: true
          commit-message: ${{ steps.ai.outputs.title || 'AI edit' }}
          title: ${{ steps.ai.outputs.title || 'AI edit' }}
          body: |
            ${{ steps.ai.outputs.body }}

            <details><summary>Translations</summary>

            ${{ steps.i18n.outputs.table }}

            </details>

            ---
            Generated by the [AI edit workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Content validated and the site built successfully. Merge to publish.
          labels: ai-edit
